<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>CORE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400&family=Share+Tech+Mono&display=swap">
<style>
  /* Layout: black void, the CORE mark centered; quests drop down from the top like a visor */
  :root {
    --bg: #000;
    --ink: #f2f2f2;          /* active, white */
    --dim: #4a4a4a;          /* done / not picked, grey */
    --faint: #1c1c1c;        /* hairlines */
    --blood: #7a3f3f;        /* missed: dark pale red */
    --blood-ink: #a86a6a;
    --f-ui: 'Oxanium', 'Segoe UI', system-ui, sans-serif;
    --f-data: 'Share Tech Mono', ui-monospace, 'Roboto Mono', monospace;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    outline: none;
  }
  ::selection { background: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
  body { overflow: hidden; font-family: var(--f-ui); font-weight: 300; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: default; }

  /* ---------- main screen ---------- */
  #main {
    position: fixed; inset: 0; touch-action: none;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hint {
    position: absolute; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    display: grid; justify-items: center; gap: 10px;
    font-size: 10px; letter-spacing: .38em; text-transform: uppercase; color: #8a8a8a;
    padding-left: .38em;
  }
  .hint::before { content: ""; width: 34px; height: 1px; background: #6a6a6a; }
  .hint b { font-weight: 400; color: var(--ink); }
  .counter {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: grid; justify-items: center; gap: 4px;
  }
  .counter .num {
    font-weight: 200; font-size: 46px; line-height: 1; letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  .counter .lbl { font-size: 9px; letter-spacing: .5em; padding-left: .5em; color: #7a7a7a; }
  .counter.bump .num { animation: bump 1.2s ease-out; }
  .counter.drop .num { animation: drop 1.6s ease-out; }
  @keyframes bump { 0% { text-shadow: 0 0 0 #fff; } 25% { text-shadow: 0 0 18px #fff, 0 0 40px rgba(255,255,255,.5); transform: scale(1.08); } 100% { text-shadow: 0 0 0 transparent; transform: none; } }
  @keyframes drop { 0%, 40% { color: var(--blood-ink); transform: translateY(4px); } 100% { color: inherit; transform: none; } }

  .sway {
    position: relative;
    width: min(62vw, 52vh, 420px); aspect-ratio: 1; max-width: 100%;
    animation: sway 12s ease-in-out infinite;
    pointer-events: none;
  }
  .mark, .mark-red { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark {
    display: block; pointer-events: none; -webkit-user-drag: none;
    animation: breathe 4s ease-in-out infinite; will-change: filter;
  }
  .mark-red {
    background: var(--blood);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    opacity: 0; transition: opacity 1.2s;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.5deg) translateY(0); }
    50%      { transform: rotate(2.5deg) translateY(-6px); }
  }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(255,255,255,.55)) drop-shadow(0 0 0 rgba(255,255,255,0)); }
    50%      { filter: drop-shadow(0 0 14px rgba(255,255,255,.6)) drop-shadow(0 0 38px rgba(255,255,255,.33)); }
  }

  /* missed day: red, still, silent glow */
  body.locked .sway { animation: none; transform: none; }
  body.locked .mark { animation: none; filter: none; opacity: 0; transition: opacity 1.2s; }
  body.locked .mark-red { opacity: 1; }
  body.locked .hint, body.locked .hint b { color: var(--blood-ink); }
  body.locked .hint::before { background: var(--blood); }

  /* ---------- quest visor ---------- */
  #visor {
    position: fixed; inset: 0; z-index: 5;
    background: var(--bg);
    transform: translateY(-100%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    border-bottom: 1px solid #2a2a2a;
  }
  #visor.open { transform: translateY(0); }
  #visor.drag { transition: none; }
  .vhead {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 22px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
    font-family: var(--f-data); font-size: 11px; letter-spacing: .14em; color: #8a8a8a;
    border-bottom: 1px solid var(--faint);
  }
  .vhead .day { color: var(--ink); font-family: var(--f-ui); font-weight: 300; letter-spacing: .32em; font-size: 12px; }
  .vhead .left { font-variant-numeric: tabular-nums; }
  .scroll {
    flex: 1; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    padding: 6px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 4px;
  }
  .sec { padding: 18px 0 8px; }
  .sec-h {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; letter-spacing: .42em; font-weight: 400;
    color: var(--dim); transition: color .9s, text-shadow .9s;
  }
  .sec-h .tag { font-family: var(--f-data); font-size: 10px; letter-spacing: .16em; }
  .sec-h::after { content: none; }
  .sec-rule { height: 1px; background: var(--faint); margin-top: 10px; position: relative; overflow: hidden; }
  .sec.active .sec-h { color: var(--ink); text-shadow: 0 0 10px rgba(255,255,255,.25); }
  .sec.active .sec-rule::after {
    content: ""; position: absolute; inset: 0; width: 30%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    animation: scan 4.5s linear infinite;
  }
  @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

  .q {
    width: 100%; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 14px;
    padding: 13px 2px; min-height: 48px;
    color: var(--dim); transition: color .8s;
  }
  .q .gem { width: 9px; height: 9px; border: 1px solid currentColor; transform: rotate(45deg); justify-self: center; transition: background .8s, box-shadow .8s; }
  .q .n { font-size: 15px; letter-spacing: .08em; position: relative; min-width: 0; }
  .q .n::after { content: ""; position: absolute; left: 0; top: 55%; height: 1px; width: 0; background: currentColor; transition: width .7s .25s ease-out; }
  .q .x { font-family: var(--f-data); font-size: 11px; letter-spacing: .08em; color: inherit; opacity: .75; text-align: right; max-width: 42vw; }
  .q.todo { color: var(--ink); }
  .q.done .n::after { width: 100%; }
  .q.done .gem { background: currentColor; }
  .q.fire { animation: fire 1.1s ease-out forwards; }
  .q.fire .gem { animation: gemfire 1.1s ease-out forwards; }
  @keyframes fire {
    0%   { color: #fff; text-shadow: 0 0 0 transparent; }
    22%  { color: #fff; text-shadow: 0 0 12px #fff, 0 0 30px rgba(255,255,255,.7); letter-spacing: .02em; }
    100% { color: var(--dim); text-shadow: 0 0 0 transparent; }
  }
  @keyframes gemfire {
    0% { background: transparent; }
    22% { background: #fff; box-shadow: 0 0 14px #fff, 0 0 30px rgba(255,255,255,.6); transform: rotate(225deg) scale(1.4); }
    100% { background: var(--dim); box-shadow: none; transform: rotate(225deg); }
  }
  .rest { font-family: var(--f-data); font-size: 11px; letter-spacing: .14em; color: #333; padding: 10px 2px 4px; }

  .banner {
    margin: 26px 0 6px; text-align: center; font-size: 12px; letter-spacing: .42em; padding-left: .42em;
    color: var(--ink);
  }
  .banner small { display: block; margin-top: 10px; font-family: var(--f-data); font-size: 11px; letter-spacing: .12em; color: #777; }
  .banner.red { color: var(--blood-ink); }
  .banner.glow { animation: bump 1.6s ease-out; }
  .vfoot {
    display: grid; justify-items: center; gap: 8px; padding: 12px 0 18px;
    font-size: 9px; letter-spacing: .44em; padding-left: .44em; color: #555;
  }
  .vfoot::after { content: ""; width: 34px; height: 1px; background: #444; }

  @media (prefers-reduced-motion: reduce) {
    .sway, .mark, .sec.active .sec-rule::after { animation: none; }
    #visor { transition: none; }
  }
</style>
</head>

<script>
// ===== CORE quest logic (pure functions, no page access) =====
var QUESTS = {
  SPORT: [
    { n: 'Run', e: '2 km', h: '5 km' },
    { n: 'Workout', e: '20 min', h: '45 min' },
    { n: 'Basketball', e: '30 min', h: '1 h' },
    { n: 'Push-ups', e: '30', h: '100' },
    { n: 'Stretch', e: '10 min', h: '20 min' },
    { n: 'Walk', e: '30 min', h: '1 h' }
  ],
  SOCIAL: [
    { n: 'Debate', e: 'one topic', h: 'defend the side you disagree with' },
    { n: 'Call a friend or family', e: '', h: '' },
    { n: 'Talk to someone new', e: '', h: '' },
    { n: 'Compliment someone', e: '', h: '' },
    { n: 'Help someone out', e: '', h: '' }
  ],
  HEALTH: [
    { n: 'Early sleep', e: 'before 23:30', h: 'before 22:30' },
    { n: 'Drink water', e: '1.5 L', h: '2.5 L' },
    { n: 'No junk food', e: '', h: '' },
    { n: 'Eat fruit or veggies', e: '2 portions', h: '5 portions' },
    { n: 'Cold shower', e: '30 s', h: '2 min' },
    { n: 'No screens before bed', e: '30 min', h: '1 h' }
  ],
  FOCUS: [
    { n: 'Meditate', e: '5 min', h: '15 min' },
    { n: 'Study', e: '30 min', h: '1 h 30' },
    { n: 'Learn language', e: '15 min', h: '45 min' },
    { n: 'Read', e: '10 pages', h: '30 pages' },
    { n: 'Cook', e: 'one meal', h: 'something new' },
    { n: 'Journal', e: '5 lines', h: 'one page' },
    { n: 'No social media', e: '2 h', h: 'until evening' }
  ]
};
var SECTIONS = ['SPORT', 'SOCIAL', 'HEALTH', 'FOCUS'];
var DAYS_PER_STAGE = 30;

function dayKey(d) {
  var m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
}
function addDays(key, n) {
  var p = key.split('-').map(Number);
  return dayKey(new Date(p[0], p[1] - 1, p[2] + n, 12));
}
function clamp(x) { return Math.max(0, Math.min(1, x)); }

// Pick 0-based index from weights
function pickWeighted(weights, rnd) {
  var sum = weights.reduce(function (a, b) { return a + b; }, 0), r = rnd() * sum;
  for (var i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return weights.length - 1;
}
function shuffle(arr, rnd) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

// boost: 0 = normal, up to 1 = after missed days (more quests)
function genDay(boost, rnd) {
  // Most days are light; some push harder; boost raises everything
  var d = clamp(Math.pow(rnd(), 2.5) * 0.85 * (1 - boost * 0.4) + boost * 0.55);
  var w = [0, 1, 2, 3].map(function (k) { return Math.exp(-Math.pow(k - 3 * d, 2) / 1.1); });
  var nSections = 1 + pickWeighted(w, rnd);
  var chosen = shuffle(SECTIONS, rnd).slice(0, nSections);
  var quests = [];
  SECTIONS.forEach(function (s) {
    if (chosen.indexOf(s) < 0) return;
    var pool = QUESTS[s];
    var mean = d * (pool.length - 1) * 0.6;
    var wq = pool.map(function (_, k) { return Math.exp(-Math.pow(k - mean, 2) / 0.9); });
    var n = 1 + pickWeighted(wq, rnd);
    shuffle(pool, rnd).slice(0, n).forEach(function (q) {
      var hard = rnd() < d;
      quests.push({ s: s, n: q.n, x: hard ? q.h : q.e, done: false });
    });
  });
  return { intensity: d, quests: quests };
}

function freshState(today, rnd) {
  var g = genDay(0, rnd);
  return { v: 1, count: 0, boost: 0, day: { date: today, type: 'normal', quests: g.quests, intensity: g.intensity, cleared: false } };
}

// Move the state forward to "today". Returns { state, missed } (missed = days failed during the jump)
function advance(state, today, rnd) {
  if (!state || !state.day) return { state: freshState(today, rnd), missed: 0 };
  var missed = 0, guard = 0;
  while (state.day.date < today && guard++ < 4000) {
    var cur = state.day, next = addDays(cur.date, 1), nextType = 'normal';
    if (cur.type === 'normal' && !cur.cleared) {
      state.count = Math.max(0, state.count - 1);
      state.boost = clamp(state.boost + 0.4);
      missed++;
      nextType = 'locked';
    } else if (cur.type === 'normal' && cur.cleared) {
      state.boost = state.boost * 0.5;
      if (state.boost < 0.05) state.boost = 0;
    }
    if (nextType === 'locked') {
      state.day = { date: next, type: 'locked', quests: [], cleared: false };
    } else if (next === today) {
      var g = genDay(state.boost, rnd);
      state.day = { date: next, type: 'normal', quests: g.quests, intensity: g.intensity, cleared: false };
    } else {
      // A day you never opened the app: it counts as missed
      state.day = { date: next, type: 'normal', quests: [], cleared: false };
    }
  }
  return { state: state, missed: missed };
}

// Mark quest i done. Returns true if this finished the whole day.
function complete(state, i) {
  var day = state.day;
  if (day.type !== 'normal' || day.cleared || !day.quests[i] || day.quests[i].done) return false;
  day.quests[i].done = true;
  if (day.quests.every(function (q) { return q.done; })) {
    day.cleared = true;
    state.count += 1;
    return true;
  }
  return false;
}

function stageFor(count) { return 1 + Math.floor(count / DAYS_PER_STAGE); }
// ===== end logic =====

</script>
<script>
(function () {
  var KEY = 'core.state.v1';
  var $ = function (id) { return document.getElementById(id); };
  var state, lastToday;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- icon stages (evolves every 30 days on the counter) ----------
  var BASE_ICON = $('mark').src, shownStage = 0;
  function toAlpha(img) {
    // Black background -> transparent, so glow and red tint follow the drawing
    var c = document.createElement('canvas'), s = 800;
    c.width = c.height = s;
    var g = c.getContext('2d');
    var r = Math.min(s / img.naturalWidth, s / img.naturalHeight);
    var w = img.naturalWidth * r, h = img.naturalHeight * r;
    g.drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
    var d = g.getImageData(0, 0, s, s), p = d.data;
    for (var i = 0; i < p.length; i += 4) {
      var m = Math.max(p[i], p[i + 1], p[i + 2]), a = Math.min(m, p[i + 3]);
      if (m > 0) { p[i] = p[i] * 255 / m; p[i + 1] = p[i + 1] * 255 / m; p[i + 2] = p[i + 2] * 255 / m; }
      p[i + 3] = a;
    }
    g.putImageData(d, 0, 0);
    return c.toDataURL('image/png');
  }
  function setIcon(url) {
    $('mark').src = url;
    $('markRed').style.webkitMaskImage = $('markRed').style.maskImage = 'url("' + url + '")';
  }
  function tryStage(n) {
    if (n <= 1) { shownStage = 1; setIcon(BASE_ICON); return; }
    var img = new Image();
    img.onload = function () {
      shownStage = n;
      try { setIcon(toAlpha(img)); } catch (e) { setIcon(img.src); }
    };
    img.onerror = function () { tryStage(n - 1); };   // not uploaded yet: keep the previous look
    img.src = 'stage-' + n + '.png';
  }
  function updateStage() {
    var want = stageFor(state.count);
    if (want !== shownStage) tryStage(want);
  }

  // ---------- sound ----------
  var music = $('music');
  function wantSrc() { return state.day.type === 'locked' ? 'core-reverse.m4a' : 'core.m4a'; }
  function play() { var p = music.play(); if (p && p.catch) p.catch(function () {}); }
  function syncSound() {
    var want = wantSrc();
    if (music.getAttribute('src') !== want) { music.setAttribute('src', want); music.load(); }
    if (!document.hidden) play();
  }
  ['touchstart', 'pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () { if (music.paused && !document.hidden) play(); }, { passive: true });
  });
  window.corePause = function () { music.pause(); };
  window.coreResume = function () { play(); };
  document.addEventListener('visibilitychange', function () { document.hidden ? music.pause() : (tick(), play()); });

  // ---------- render ----------
  function remaining() { return state.day.quests.filter(function (q) { return !q.done; }).length; }

  function renderMain() {
    var day = state.day;
    document.body.classList.toggle('locked', day.type === 'locked');
    $('num').textContent = state.count;
    var h = $('hint');
    if (day.type === 'locked') h.innerHTML = '<span>MISSED &middot; LOCKED</span>';
    else if (day.cleared) h.innerHTML = '<span><b>DAY CLEARED</b></span>';
    else { var n = remaining(); h.innerHTML = '<span><b>' + n + '</b> QUEST' + (n === 1 ? '' : 'S') + ' LEFT</span>'; }
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function renderVisor() {
    var day = state.day, box = $('scroll');
    $('vday').textContent = 'DAY ' + state.count;
    box.innerHTML = '';
    if (day.type === 'locked') {
      var b = el('div', 'banner red', 'MISSED');
      b.appendChild(el('small', null, '−1 DAY · NO QUESTS UNTIL MIDNIGHT'));
      box.appendChild(b);
    }
    SECTIONS.forEach(function (s) {
      var list = [];
      day.quests.forEach(function (q, i) { if (q.s === s) list.push(i); });
      var todo = list.filter(function (i) { return !day.quests[i].done; }).length;
      var sec = el('div', 'sec' + (todo > 0 && day.type === 'normal' ? ' active' : ''));
      sec.dataset.s = s;
      var head = el('div', 'sec-h');
      head.appendChild(el('span', null, s));
      var tag = day.type === 'locked' ? 'LOCKED' : list.length === 0 ? 'REST' : todo === 0 ? 'DONE' : (list.length - todo) + '/' + list.length;
      head.appendChild(el('span', 'tag', tag));
      sec.appendChild(head);
      sec.appendChild(el('div', 'sec-rule'));
      list.forEach(function (i) {
        var q = day.quests[i];
        var row = el('button', 'q ' + (q.done ? 'done' : 'todo'));
        row.type = 'button';
        row.dataset.i = i;
        row.appendChild(el('span', 'gem'));
        row.appendChild(el('span', 'n', q.n));
        row.appendChild(el('span', 'x', q.x || ''));
        sec.appendChild(row);
      });
      box.appendChild(sec);
    });
    if (day.type === 'normal' && day.cleared) {
      var c = el('div', 'banner', 'DAY CLEARED');
      c.appendChild(el('small', null, 'NEXT QUESTS AT MIDNIGHT'));
      box.appendChild(c);
    }
  }

  function renderAll() { renderMain(); renderVisor(); updateStage(); syncSound(); }

  // ---------- validate a quest ----------
  $('scroll').addEventListener('click', function (e) {
    var row = e.target.closest('.q.todo');
    if (!row || Date.now() < noClickUntil) return;
    var i = +row.dataset.i;
    var finished = complete(state, i);
    save();
    row.classList.remove('todo');
    row.classList.add('fire', 'done');
    var sec = row.closest('.sec'), s = sec.dataset.s;
    var list = state.day.quests.filter(function (q) { return q.s === s; });
    var left = list.filter(function (q) { return !q.done; }).length;
    sec.querySelector('.tag').textContent = left === 0 ? 'DONE' : (list.length - left) + '/' + list.length;
    if (left === 0) setTimeout(function () { sec.classList.remove('active'); }, 500);
    renderMain();
    if (finished) {
      setTimeout(function () {
        renderVisor();
        var b = document.querySelector('.banner'); if (b) b.classList.add('glow');
        $('counter').classList.remove('bump'); void $('counter').offsetWidth; $('counter').classList.add('bump');
        updateStage();
      }, 1100);
    }
  });

  // ---------- swipe down to open, swipe up to close ----------
  var visor = $('visor'), scroller = $('scroll');
  var startY = null, dy = 0, dragMoved = false, mode = null, atBottom = false, noClickUntil = 0;
  function isOpen() { return visor.classList.contains('open'); }
  function setOpen(v) { visor.classList.remove('drag'); visor.style.transform = ''; visor.classList.toggle('open', v); }

  function down(y) {
    startY = y; dy = 0; dragMoved = false;
    mode = isOpen() ? 'close' : 'open';
    atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2;
  }
  function move(y) {
    if (startY == null) return;
    dy = y - startY;
    if (Math.abs(dy) > 8) dragMoved = true;
    var h = window.innerHeight;
    if (mode === 'open' && dy > 0) {
      visor.classList.add('drag');
      visor.style.transform = 'translateY(' + Math.min(0, -h + dy * 1.1) + 'px)';
    } else if (mode === 'close' && dy < 0 && atBottom) {
      visor.classList.add('drag');
      visor.style.transform = 'translateY(' + Math.max(-h, dy) + 'px)';
    }
  }
  function up() {
    if (startY == null) return;
    if (mode === 'open') setOpen(dy > 70);
    else if (mode === 'close') setOpen(!(dy < -70 && atBottom));
    if (dragMoved) noClickUntil = Date.now() + 450;
    startY = null;
  }
  document.addEventListener('touchstart', function (e) { down(e.touches[0].clientY); }, { passive: true });
  document.addEventListener('touchmove', function (e) { move(e.touches[0].clientY); }, { passive: true });
  document.addEventListener('touchend', up, { passive: true });
  document.addEventListener('touchcancel', up, { passive: true });
  // mouse, for testing on a computer
  var mouseDown = false;
  document.addEventListener('mousedown', function (e) { mouseDown = true; down(e.clientY); });
  document.addEventListener('mousemove', function (e) { if (mouseDown) move(e.clientY); });
  document.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; up(); } });
  document.addEventListener('wheel', function (e) {
    if (!isOpen() && e.deltaY < -20) setOpen(true);
    else if (isOpen() && e.deltaY > 20 && scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) setOpen(false);
  }, { passive: true });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- clock: deadline is midnight ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var now = new Date(), today = dayKey(now);
    if (today !== lastToday) {
      var r = advance(state, today, Math.random);
      state = r.state; lastToday = today; save();
      renderAll();
      if (r.missed > 0) { $('counter').classList.remove('drop'); void $('counter').offsetWidth; $('counter').classList.add('drop'); }
    }
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    var s = Math.max(0, Math.floor((end - now) / 1000));
    var t = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
    $('left').textContent = state.day.type === 'locked' ? 'UNLOCKS IN ' + t : state.day.cleared ? 'NEW IN ' + t : 'ENDS IN ' + t;
  }

  state = load();
  lastToday = null;
  tick();
  setInterval(tick, 1000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
