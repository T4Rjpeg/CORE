<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>CORE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400&family=Share+Tech+Mono&display=swap">
<style>
  /* Layout: black void, CORE mark centered. Quests drop from the top, games rise from the bottom,
     the tree slides in from the right, the store from the left. */
  :root {
    --bg: #000;
    --ink: #f2f2f2;
    --dim: #4a4a4a;
    --mute: #8a8a8a;
    --faint: #1c1c1c;
    --blood: #7a3f3f;
    --blood-ink: #a86a6a;
    --f-ui: 'Oxanium', 'Segoe UI', system-ui, sans-serif;
    --f-data: 'Share Tech Mono', ui-monospace, 'Roboto Mono', monospace;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    outline: none;
  }
  ::selection { background: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
  body { overflow: hidden; font-family: var(--f-ui); font-weight: 300; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: default; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* ---------- main ---------- */
  #main {
    position: fixed; inset: 0; touch-action: none;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hint {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 22px);
    display: grid; justify-items: center; gap: 10px;
    font-size: 10px; letter-spacing: .38em; text-transform: uppercase; color: var(--mute); padding-left: .38em;
  }
  .hint::before { content: ""; width: 34px; height: 1px; background: #6a6a6a; }
  .hint b { font-weight: 400; color: var(--ink); }
  .edge { position: absolute; top: 50%; width: 1px; height: 30px; margin-top: -15px; background: #2c2c2c; }
  .edge.l { left: max(10px, env(safe-area-inset-left, 0px)); }
  .edge.r { right: max(10px, env(safe-area-inset-right, 0px)); }
  .counter {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    display: grid; justify-items: center; gap: 6px;
  }
  .counter .num { font-weight: 200; font-size: 40px; line-height: 1; letter-spacing: .14em; padding-left: .14em; }
  .counter .lbl { font-size: 9px; letter-spacing: .5em; padding-left: .5em; color: #7a7a7a; }
  .counter::after { content: ""; width: 34px; height: 1px; background: #2c2c2c; margin-top: 8px; }
  .counter.bump .num { animation: bump 1.2s ease-out; }
  .counter.drop .num { animation: drop 1.6s ease-out; }
  @keyframes bump { 25% { text-shadow: 0 0 18px #fff, 0 0 40px rgba(255,255,255,.5); transform: scale(1.06); } }
  @keyframes drop { 0%, 40% { color: var(--blood-ink); transform: translateY(4px); } }

  .sway { position: relative; width: min(62vw, 50vh, 420px); aspect-ratio: 1; max-width: 100%; animation: sway 12s ease-in-out infinite; pointer-events: none; }
  .mark, .mark-red { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark { display: block; pointer-events: none; -webkit-user-drag: none; animation: breathe 4s ease-in-out infinite; will-change: filter; }
  .mark-red {
    background: var(--blood);
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center; opacity: 0; transition: opacity 1.2s;
  }
  @keyframes sway { 0%, 100% { transform: rotate(-2.5deg) translateY(0); } 50% { transform: rotate(2.5deg) translateY(-6px); } }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(255,255,255,.55)) drop-shadow(0 0 0 rgba(255,255,255,0)); }
    50%      { filter: drop-shadow(0 0 14px rgba(255,255,255,.6)) drop-shadow(0 0 38px rgba(255,255,255,.33)); }
  }
  body.locked .sway { animation: none; transform: none; }
  body.locked .mark { animation: none; filter: none; opacity: 0; transition: opacity 1.2s; }
  body.locked .mark-red { opacity: 1; }
  body.locked .hint, body.locked .hint b { color: var(--blood-ink); }
  body.locked .hint::before { background: var(--blood); }

  /* ---------- panels ---------- */
  .panel {
    position: fixed; inset: 0; z-index: 5; background: var(--bg);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .panel[data-from="top"] { transform: translateY(-100%); }
  .panel[data-from="bottom"] { transform: translateY(100%); }
  .panel[data-from="right"] { transform: translateX(100%); }
  .panel[data-from="left"] { transform: translateX(-100%); }
  .panel.open { transform: none; }
  .panel.drag { transition: none; }
  .phead {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 22px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
    font-family: var(--f-data); font-size: 11px; letter-spacing: .14em; color: var(--mute);
    border-bottom: 1px solid var(--faint);
  }
  .phead .ttl { color: var(--ink); font-family: var(--f-ui); font-weight: 300; letter-spacing: .32em; font-size: 12px; }
  .phead .bal { font-family: var(--f-ui); font-weight: 200; font-size: 22px; letter-spacing: .06em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .scroll {
    flex: 1; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; min-height: 0;
    padding: 6px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 4px;
  }
  .pfoot { display: grid; justify-items: center; gap: 8px; padding: 12px 0 18px; font-size: 9px; letter-spacing: .44em; padding-left: .44em; color: #555; }
  .pfoot::after { content: ""; width: 34px; height: 1px; background: #444; }
  .pfoot.up { order: -1; padding: 0; }
  .pfoot.up::after { display: none; }
  .pfoot.up::before { content: ""; width: 34px; height: 1px; background: #444; }

  /* ---------- quests ---------- */
  .sec { padding: 18px 0 8px; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; letter-spacing: .42em; font-weight: 400; color: var(--dim); transition: color .9s, text-shadow .9s; }
  .tag { font-family: var(--f-data); font-size: 10px; letter-spacing: .16em; }
  .sec-rule { height: 1px; background: var(--faint); margin-top: 10px; position: relative; overflow: hidden; }
  .sec.active .sec-h { color: var(--ink); text-shadow: 0 0 10px rgba(255,255,255,.25); }
  .sec.active .sec-rule::after { content: ""; position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation: scan 4.5s linear infinite; }
  @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .q { width: 100%; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 14px; padding: 13px 2px; min-height: 48px; color: var(--dim); transition: color .8s; }
  .gem { width: 9px; height: 9px; border: 1px solid currentColor; transform: rotate(45deg); justify-self: center; transition: background .8s, box-shadow .8s; }
  .q .n { font-size: 15px; letter-spacing: .08em; position: relative; min-width: 0; }
  .q .n::after { content: ""; position: absolute; left: 0; top: 55%; height: 1px; width: 0; background: currentColor; transition: width .7s .25s ease-out; }
  .q .x { font-family: var(--f-data); font-size: 11px; letter-spacing: .08em; opacity: .75; text-align: right; max-width: 42vw; }
  .q.todo { color: var(--ink); }
  .q.done .n::after { width: 100%; }
  .q.done .gem { background: currentColor; }
  .q.fire { animation: fire 1.1s ease-out forwards; }
  .q.fire .gem { animation: gemfire 1.1s ease-out forwards; }
  @keyframes fire { 0% { color: #fff; } 22% { color: #fff; text-shadow: 0 0 12px #fff, 0 0 30px rgba(255,255,255,.7); letter-spacing: .02em; } 100% { color: var(--dim); } }
  @keyframes gemfire { 22% { background: #fff; box-shadow: 0 0 14px #fff, 0 0 30px rgba(255,255,255,.6); transform: rotate(225deg) scale(1.4); } 100% { background: var(--dim); transform: rotate(225deg); } }
  .banner { margin: 26px 0 6px; text-align: center; font-size: 12px; letter-spacing: .42em; padding-left: .42em; color: var(--ink); }
  .banner small { display: block; margin-top: 10px; font-family: var(--f-data); font-size: 11px; letter-spacing: .12em; color: #777; }
  .banner.red { color: var(--blood-ink); }
  .banner.glow { animation: bump 1.6s ease-out; }

  /* ---------- feedback ---------- */
  .ok { animation: okf .6s ease-out; }
  .ko { animation: kof .5s ease-out; }
  @keyframes okf { 30% { color: #fff; text-shadow: 0 0 14px #fff, 0 0 28px rgba(255,255,255,.6); box-shadow: 0 0 18px rgba(255,255,255,.25); } }
  @keyframes kof { 20% { transform: translateX(-6px); color: var(--blood-ink); border-color: var(--blood); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } }

  /* ---------- games list + setup ---------- */
  .grow { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 18px 2px; border-bottom: 1px solid var(--faint); }
  .grow .gn { font-size: 14px; letter-spacing: .34em; font-weight: 400; }
  .grow .gd { grid-column: 1; font-family: var(--f-data); font-size: 11px; color: #777; letter-spacing: .03em; line-height: 1.5; }
  .grow .gt { grid-row: 1 / 3; grid-column: 2; align-self: center; font-family: var(--f-data); font-size: 11px; color: var(--mute); letter-spacing: .1em; }
  .grow:active { background: #080808; }
  .gsetup { display: flex; flex-direction: column; gap: 24px; padding: 26px 0; }
  .gsetup .gname { font-size: 20px; letter-spacing: .42em; font-weight: 300; }
  .gsetup .gdesc { font-family: var(--f-data); font-size: 12px; color: #888; line-height: 1.6; max-width: 46ch; }
  .lab { font-size: 9px; letter-spacing: .44em; color: #666; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid #2a2a2a; padding: 11px 0; width: 60px; text-align: center; font-family: var(--f-data); font-size: 12px; letter-spacing: .1em; color: var(--mute); transition: border-color .2s, color .2s, box-shadow .2s; }
  .chip.on { border-color: #d8d8d8; color: #fff; box-shadow: 0 0 14px rgba(255,255,255,.14); }
  .greward { font-weight: 200; font-size: 44px; line-height: 1; letter-spacing: .04em; }
  .gnote { font-family: var(--f-data); font-size: 11px; color: #777; letter-spacing: .08em; margin-top: 8px; }
  .brow { display: flex; gap: 10px; flex-wrap: wrap; }
  .gbtn { border: 1px solid #3a3a3a; padding: 15px 26px; font-size: 12px; letter-spacing: .38em; color: var(--ink); text-align: center; min-width: 160px; }
  .gbtn.ghost { border-color: #1f1f1f; color: #777; min-width: 0; }
  .gbtn:active { background: #111; }
  .gbtn[disabled] { color: #444; border-color: #1c1c1c; }

  /* ---------- running game ---------- */
  #ghost { position: absolute; inset: 0; z-index: 3; }
  .gscreen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .gtop { display: flex; justify-content: space-between; align-items: center; padding: 18px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px)); font-family: var(--f-data); letter-spacing: .14em; }
  .gquit { font-family: var(--f-data); font-size: 11px; letter-spacing: .2em; color: var(--mute); padding: 8px 0; min-width: 96px; }
  .gclock { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .gscore { min-width: 96px; text-align: right; font-size: 13px; color: var(--ink); }
  .gprog { height: 1px; background: var(--faint); margin: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
  .gprog div { height: 100%; background: #777; transform-origin: left; transform: scaleX(0); }
  .gstage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 16px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); touch-action: none; }
  .g-info { font-size: 11px; letter-spacing: .38em; padding-left: .38em; color: var(--mute); text-transform: uppercase; text-align: center; }
  .m-box { display: grid; justify-items: center; gap: 16px; width: 100%; }
  .m-q { font-weight: 200; font-size: 50px; letter-spacing: .04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .m-a { font-family: var(--f-data); font-size: 30px; min-height: 44px; min-width: 130px; text-align: center; letter-spacing: .12em; border-bottom: 1px solid #333; padding-bottom: 6px; }
  .m-a.ko { color: var(--blood-ink); }
  .m-bar { width: min(320px, 80%); height: 1px; background: var(--faint); }
  .m-bar div { height: 100%; background: #ddd; transform-origin: left; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); width: min(360px, 100%); border-top: 1px solid var(--faint); }
  .key { height: 62px; font-size: 26px; font-weight: 200; text-align: center; border-bottom: 1px solid var(--faint); color: var(--ink); }
  .key:active { background: #101010; }
  .key.blank { pointer-events: none; }
  .pgrid { display: grid; gap: 10px; width: min(330px, 86vw, 46vh); aspect-ratio: 1; }
  .cell { border: 1px solid #2e2e2e; background: transparent; transition: background .12s, box-shadow .12s; min-height: 0; }
  .cell.lit { background: #f2f2f2; box-shadow: 0 0 18px rgba(255,255,255,.5); border-color: #f2f2f2; }
  .cell.bad { background: var(--blood); border-color: var(--blood); }
  .arow { display: flex; gap: 4px; height: 64px; align-items: center; color: #9a9a9a; }
  .arow span { width: 50px; height: 50px; display: block; }
  .arow span svg, .azone svg { width: 100%; height: 100%; display: block; }
  .arow .mid { color: #fff; }
  .arow.ko { color: var(--blood-ink); }
  .azones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; }
  .azone { height: 130px; border: 1px solid #262626; display: grid; place-items: center; color: #cfcfcf; padding: 44px; }
  .azone:active { background: #0c0c0c; }
  .ngrid { display: grid; width: min(360px, 92vw, 52vh); aspect-ratio: 1; border-top: 1px solid #222; border-left: 1px solid #222; }
  .ncell { border-right: 1px solid #222; border-bottom: 1px solid #222; text-align: center; font-size: 19px; font-weight: 300; font-variant-numeric: tabular-nums; color: var(--ink); transition: color .25s; min-height: 0; }
  .ncell.gone { color: #2c2c2c; }
  .ncell.ko { color: var(--blood-ink); }
  .match { min-width: 220px; }
  .r-box { flex: 1; min-height: 0; width: 100%; max-width: 62ch; overflow-y: auto; touch-action: pan-y; padding-top: 8px; }
  .r-t { font-size: 13px; letter-spacing: .4em; margin-bottom: 20px; color: var(--ink); }
  .r-b { font-size: 16px; line-height: 1.75; color: #d6d6d6; margin: 0; }
  .r-qbox { display: grid; gap: 22px; width: 100%; max-width: 62ch; }
  .r-q { font-size: 19px; line-height: 1.45; text-wrap: balance; }
  .r-opts { display: grid; }
  .r-opt { display: grid; grid-template-columns: 14px 1fr; gap: 14px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--faint); font-size: 15px; letter-spacing: .03em; color: var(--ink); }
  .r-opt.ok { color: #fff; } .r-opt.ok .gem { background: #fff; box-shadow: 0 0 12px #fff; }
  .r-opt.ko { color: var(--blood-ink); } .r-opt.ko .gem { background: var(--blood); }
  .gend { display: grid; justify-items: center; gap: 16px; text-align: center; }
  .gend-h { font-size: 14px; letter-spacing: .5em; padding-left: .5em; }
  .gend-l, .gend-s { font-family: var(--f-data); font-size: 12px; color: var(--mute); letter-spacing: .1em; }
  .gend-r { font-size: 48px; font-weight: 200; margin: 10px 0 14px; animation: bump 1.4s ease-out; }
  .gend-r.none { font-size: 12px; letter-spacing: .38em; color: #555; animation: none; }

  /* ---------- tree ---------- */
  #treeScroll { padding: 0; }
  #treeSvg { display: block; width: 100%; }
  #treeSvg text { font-family: var(--f-data); font-size: 9px; letter-spacing: .1em; }
  .halo { animation: halo 2.6s ease-in-out infinite; }
  @keyframes halo { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
  .tsheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; max-height: 64%; overflow-y: auto; touch-action: pan-y;
    background: #040404; border-top: 1px solid #2a2a2a;
    padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(20px, env(safe-area-inset-left, 0px));
    transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
    display: grid; gap: 14px;
  }
  .tsheet.open { transform: none; }
  .ts-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; letter-spacing: .32em; }
  .ts-h .tag { color: var(--mute); }
  .ts-h .tag.red { color: var(--blood-ink); }
  .ts-line { font-family: var(--f-data); font-size: 11px; letter-spacing: .1em; color: #8a8a8a; line-height: 1.6; }
  .ts-line.red { color: var(--blood-ink); }
  .ts-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 12px; align-items: center; font-size: 13px; letter-spacing: .05em; color: #bbb; }
  .ts-row.done { color: var(--ink); } .ts-row.done .gem { background: currentColor; }
  .ts-row.miss { color: #555; }
  .ts-row .x { font-family: var(--f-data); font-size: 10px; color: #777; }

  /* ---------- store ---------- */
  .item { border-bottom: 1px solid var(--faint); padding: 22px 0; display: grid; gap: 12px; }
  .item-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; letter-spacing: .3em; }
  .price { font-family: var(--f-ui); font-weight: 200; font-size: 22px; letter-spacing: .04em; }
  .item-d { font-family: var(--f-data); font-size: 11px; color: #777; line-height: 1.6; max-width: 48ch; }
  .shead { font-size: 9px; letter-spacing: .44em; color: #666; padding-top: 26px; }
  textarea.code {
    width: 100%; min-height: 88px; background: #050505; border: 1px solid #262626; color: #bbb;
    font-family: var(--f-data); font-size: 11px; line-height: 1.5; padding: 10px; resize: none; word-break: break-all;
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }
  textarea.code:focus { border-color: #555; }
  .status { font-family: var(--f-data); font-size: 11px; color: var(--mute); letter-spacing: .08em; min-height: 1.4em; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); z-index: 20;
    transform: translate(-50%, 10px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
    font-family: var(--f-data); font-size: 11px; letter-spacing: .18em; color: var(--ink);
    border: 1px solid #333; background: #000; padding: 10px 16px; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .sway, .mark, .sec.active .sec-rule::after, .halo { animation: none; }
    .panel { transition: none; }
  }
</style>
</head>
<body>
<main id="main" aria-label="CORE">
  <div class="hint" id="hint"><span>—</span></div>
