name: Build CORE APK

# Run it from the Actions tab: "Build CORE APK" -> "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          P=android
          mkdir -p $P/app/src/main/java/com/core/app
          mkdir -p $P/app/src/main/assets
          mkdir -p $P/app/src/main/res/values $P/app/src/main/res/values-v28
          mkdir -p $P/app/src/main/res/drawable-nodpi $P/app/src/main/res/mipmap-anydpi-v26 $P/app/src/main/res/mipmap-xxxhdpi
          mkdir -p $P/app/src/main/res/layout $P/app/src/main/res/xml

          # Your files from the repo: offline backup page, sound, icons
          cp index.html core.m4a $P/app/src/main/assets/
          cp app-icon.png $P/app/src/main/res/drawable-nodpi/core_fg.png
          cp icon-512.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp widget.png $P/app/src/main/res/drawable-nodpi/core_widget.png

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CORE"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.core.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.t4rjpeg.core"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="&#8203;"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/CoreTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|uiMode|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name=".CoreWidget"
                      android:label="CORE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/core_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/core/app/MainActivity.java <<'EOF'
          package com.core.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              private static final String SITE = "https://t4rjpeg.github.io/CORE/";
              private static final String BACKUP = "file:///android_asset/index.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  // Taps and long presses do nothing (no blue highlight, no menu)
                  web.setLongClickable(false);
                  web.setOnLongClickListener(v -> true);
                  web.setHapticFeedbackEnabled(false);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          // No internet and nothing saved yet: show the copy built into the app
                          if (req.isForMainFrame() && !BACKUP.equals(view.getUrl())) {
                              view.loadUrl(BACKUP);
                          }
                      }
                  });
                  setContentView(web);
                  hideBars();
                  web.loadUrl(SITE);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.evaluateJavascript("window.corePause && corePause()", null);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.evaluateJavascript("window.coreResume && coreResume()", null);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
          }
          EOF

          cat > $P/app/src/main/java/com/core/app/CoreWidget.java <<'EOF'
          package com.core.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          // Big CORE icon for the home screen; tap it to open the app
          public class CoreWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  Intent open = new Intent(ctx, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent pi = PendingIntent.getActivity(ctx, 0, open,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  for (int id : ids) {
                      RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.core_widget);
                      v.setOnClickPendingIntent(R.id.core_widget_img, pi);
                      mgr.updateAppWidget(id, v);
                  }
              }
          }
          EOF

          cat > $P/app/src/main/res/layout/core_widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <ImageView
                  android:id="@+id/core_widget_img"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"
                  android:src="@drawable/core_widget"
                  android:contentDescription="CORE" />
          </FrameLayout>
          EOF

          cat > $P/app/src/main/res/xml/core_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:minResizeWidth="40dp"
              android:minResizeHeight="40dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:initialLayout="@layout/core_widget"
              android:previewImage="@drawable/core_widget"
              android:updatePeriodMillis="0" />
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="CoreTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
              <color name="core_bg">#000000</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/values-v28/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="CoreTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/core_bg" />
              <foreground android:drawable="@drawable/core_fg" />
          </adaptive-icon>
          EOF

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CORE.apk
          gh release create "apk-${{ github.run_number }}" CORE.apk \
            --title "CORE app (build ${{ github.run_number }})" \
            --notes "Uninstall the old CORE first, then download CORE.apk, open it from Files, and install."
